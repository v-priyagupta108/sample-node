name: setup-node PR 1627 - manifest fallback

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  action-v7:
    name: Released v7 (reproduces failure)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Exhaust anonymous GitHub API rate limit
        shell: bash
        run: |
          set -euo pipefail

          headers_file="$RUNNER_TEMP/github-api-headers"
          response_file="$RUNNER_TEMP/github-api-response"
          api_url="https://api.github.com/repos/actions/node-versions"

          curl --silent --show-error \
            --dump-header "$headers_file" \
            --output /dev/null \
            "$api_url?request=initial"

          remaining=$(awk 'tolower($1) == "x-ratelimit-remaining:" {gsub("\r", "", $2); print $2}' "$headers_file" | tail -1)
          if [[ ! "$remaining" =~ ^[0-9]+$ ]]; then
            echo "Could not read the anonymous API rate limit."
            cat "$headers_file"
            exit 1
          fi

          echo "Anonymous requests remaining before exhaustion: $remaining"
          for ((request = 1; request <= remaining + 1; request++)); do
            status_code=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$api_url?request=$request")

            if [[ "$status_code" == "403" || "$status_code" == "429" ]]; then
              echo "Rate limit reproduced after $request requests (HTTP $status_code)."
              cat "$response_file"
              exit 0
            fi
          done

          echo "Expected GitHub API to return HTTP 403 or 429 after exhausting the quota."
          cat "$response_file"
          exit 1

      - name: Resolve an LTS alias after rate limiting
        id: setup
        continue-on-error: true
        uses: actions/setup-node@v7
        with:
          node-version: lts/iron
          token: ''
          package-manager-cache: false

      - name: Confirm the released action fails without raw fallback
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: |
          if [[ "$SETUP_OUTCOME" != "failure" ]]; then
            echo "Expected setup-node v7 to fail after API rate limiting, got: $SETUP_OUTCOME"
            exit 1
          fi

  pr-action:
    name: PR 1627 (raw fallback succeeds)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Exhaust anonymous GitHub API rate limit
        shell: bash
        run: |
          set -euo pipefail

          headers_file="$RUNNER_TEMP/github-api-headers"
          response_file="$RUNNER_TEMP/github-api-response"
          api_url="https://api.github.com/repos/actions/node-versions"

          curl --silent --show-error \
            --dump-header "$headers_file" \
            --output /dev/null \
            "$api_url?request=initial"

          remaining=$(awk 'tolower($1) == "x-ratelimit-remaining:" {gsub("\r", "", $2); print $2}' "$headers_file" | tail -1)
          if [[ ! "$remaining" =~ ^[0-9]+$ ]]; then
            echo "Could not read the anonymous API rate limit."
            cat "$headers_file"
            exit 1
          fi

          echo "Anonymous requests remaining before exhaustion: $remaining"
          for ((request = 1; request <= remaining + 1; request++)); do
            status_code=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$api_url?request=$request")

            if [[ "$status_code" == "403" || "$status_code" == "429" ]]; then
              echo "Rate limit reproduced after $request requests (HTTP $status_code)."
              cat "$response_file"
              exit 0
            fi
          done

          echo "Expected GitHub API to return HTTP 403 or 429 after exhausting the quota."
          cat "$response_file"
          exit 1

      - name: Resolve the same LTS alias after rate limiting
        id: setup
        uses: BridgeAR/setup-node@BridgeAR/2026-09-03-setup-node-manifest
        with:
          node-version: lts/iron
          token: ''
          package-manager-cache: false

      - name: Verify the fallback installation
        env:
          RESOLVED_NODE_VERSION: ${{ steps.setup.outputs.node-version }}
        run: |
          node --version
          echo "setup-node resolved $RESOLVED_NODE_VERSION"