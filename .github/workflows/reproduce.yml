name: Reproduce actions/setup-node#1657 - allow-alpha

on: [push, workflow_dispatch]

jobs:
  action-v7:
    name: actions/setup-node@v7 (fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '27'
          allow-alpha: true
      - run: node --version

  pr-branch:
    name: PR branch (installs newest 27 alpha)
    runs-on: ubuntu-latest
    steps:
      - uses: v-priyagupta108/setup-node@allow-alpha
        with:
          node-version: '27'
          allow-alpha: true
      - run: node --version
