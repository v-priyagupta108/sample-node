name: setup-node PR 1627 - uncached numeric Node 26

on:
  workflow_dispatch:
  push:
    

permissions:
  contents: read

env:
  NODE_VERSION: 26.11.1

jobs:
  action-v7:
    name: v7 falls back to nodejs.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Remove Node 26 from the runner tool cache
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TOOL_CACHE/node/$NODE_VERSION/x64" \
            "$RUNNER_TOOL_CACHE/node/$NODE_VERSION/x64.complete"
          test ! -e "$RUNNER_TOOL_CACHE/node/$NODE_VERSION/x64"

      - name: Exhaust anonymous GitHub API rate limit
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/actions/node-versions"
          headers_file="$RUNNER_TEMP/github-api-headers"
          response_file="$RUNNER_TEMP/github-api-response"

          curl --silent --show-error --dump-header "$headers_file" \
            --output /dev/null "$api_url?request=initial"
          remaining=$(awk 'tolower($1) == "x-ratelimit-remaining:" {gsub("\r", "", $2); print $2}' "$headers_file" | tail -1)
          if [[ ! "$remaining" =~ ^[0-9]+$ ]]; then
            echo "Could not read the anonymous API rate limit."
            exit 1
          fi

          for ((request = 1; request <= remaining + 1; request++)); do
            status_code=$(curl --silent --show-error \
              --output "$response_file" --write-out '%{http_code}' \
              "$api_url?request=$request")
            if [[ "$status_code" == "403" || "$status_code" == "429" ]]; then
              echo "Rate limit reproduced (HTTP $status_code)."
              exit 0
            fi
          done
          echo "The anonymous API quota was not exhausted."
          exit 1

      - name: Install uncached Node 26 with v7
        id: setup
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          token: ''
          package-manager-cache: false

      - name: Verify nodejs.org fallback installation
        shell: bash
        env:
          RESOLVED_NODE_VERSION: ${{ steps.setup.outputs.node-version }}
        run: |
          test "$(node --version)" = "v$NODE_VERSION"
          test "$RESOLVED_NODE_VERSION" = "v$NODE_VERSION"
          echo "v7 installed $RESOLVED_NODE_VERSION after the manifest API was rate-limited."

  pr-action:
    name: PR falls back to raw manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Remove Node 26 from the runner tool cache
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TOOL_CACHE/node/$NODE_VERSION/x64" \
            "$RUNNER_TOOL_CACHE/node/$NODE_VERSION/x64.complete"
          test ! -e "$RUNNER_TOOL_CACHE/node/$NODE_VERSION/x64"

      - name: Exhaust anonymous GitHub API rate limit
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/actions/node-versions"
          headers_file="$RUNNER_TEMP/github-api-headers"
          response_file="$RUNNER_TEMP/github-api-response"

          curl --silent --show-error --dump-header "$headers_file" \
            --output /dev/null "$api_url?request=initial"
          remaining=$(awk 'tolower($1) == "x-ratelimit-remaining:" {gsub("\r", "", $2); print $2}' "$headers_file" | tail -1)
          if [[ ! "$remaining" =~ ^[0-9]+$ ]]; then
            echo "Could not read the anonymous API rate limit."
            exit 1
          fi

          for ((request = 1; request <= remaining + 1; request++)); do
            status_code=$(curl --silent --show-error \
              --output "$response_file" --write-out '%{http_code}' \
              "$api_url?request=$request")
            if [[ "$status_code" == "403" || "$status_code" == "429" ]]; then
              echo "Rate limit reproduced (HTTP $status_code)."
              exit 0
            fi
          done
          echo "The anonymous API quota was not exhausted."
          exit 1

      - name: Install uncached Node 26 with PR
        id: setup
        uses: BridgeAR/setup-node@BridgeAR/2026-09-03-setup-node-manifest
        with:
          node-version: ${{ env.NODE_VERSION }}
          token: ''
          package-manager-cache: false

      - name: Verify raw-manifest installation
        shell: bash
        env:
          RESOLVED_NODE_VERSION: ${{ steps.setup.outputs.node-version }}
        run: |
          test "$(node --version)" = "v$NODE_VERSION"
          test "$RESOLVED_NODE_VERSION" = "v$NODE_VERSION"
          echo "PR installed $RESOLVED_NODE_VERSION after using the raw manifest fallback."